; PlatformIO Project Configuration File for Project Alpha ESP32-S3 Motor Controller
;
; Build & Upload:
;   pio run --target upload
; Serial Monitor:
;   pio device monitor --baud 115200

[platformio]
default_envs = esp32_s3_mini

[env:esp32_s3_mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Board configuration for ESP32-S3 Mini / Zero / DevKitC
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio

; Native USB CDC configuration for hardware USB serial
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
